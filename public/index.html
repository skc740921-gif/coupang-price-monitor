<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠팡 가격 모니터</title>
<style>
body{margin:0;background:#f5f6f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111}
.wrap{max-width:760px;margin:auto;padding:18px 12px 60px}
.card{background:#fff;border:1px solid #e2e4e7;border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:23px;margin:0 0 5px}.sub{font-size:12px;color:#666;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;margin-top:8px}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;margin-top:8px;cursor:pointer}
.primary{background:#111;color:#fff;width:100%}.muted{font-size:12px;color:#777}
.item{background:#fff;border:1px solid #e2e4e7;border-radius:14px;padding:15px;margin-top:10px}
.name{font-weight:900;line-height:1.4}.price{font-size:25px;font-weight:900;margin-top:5px}
.diff{font-size:13px;margin-top:4px}.meta{font-size:12px;color:#666;margin-top:5px;line-height:1.5}
.down{color:#0a7d2d}.up{color:#b00020}
</style></head>
<body><div class="wrap">
<div class="card"><h1>쿠팡 가격 모니터</h1><div class="sub">휴대폰에서도 볼 수 있습니다. 최초 1회 API 키를 입력하세요.</div>
<input id="key" type="password" placeholder="API 키">
<button class="primary" id="save">저장하고 불러오기</button><div id="status" class="muted"></div></div>
<div id="list"></div>
</div><script src="/app.js"></script></body></html>
